<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exterminador no esgoto</title>
<meta name="description" content="Mini game de plataforma: o Exterminador queima slimes no esgoto com o lança-chamas.">
<style>
@layer reset, base, components;

@layer reset {
  :where(*, *::before, *::after) { box-sizing: border-box; margin: 0; padding: 0; }
}

@layer base {
  html, body { height: 100%; background: #000; overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    font: 12px/1.35 ui-monospace, "Cascadia Mono", Consolas, monospace;
    color: #b3ab9d;
  }
}

@layer components {
  .screen { display: block; image-rendering: pixelated; }
  .hud {
    position: fixed;
    inset: auto 0 0 0;
    padding: 4px 8px;
    background: rgb(0 0 0 / 0.6);
    text-align: center;
    white-space: pre-wrap;
    pointer-events: none;
  }
  .hud-pad { color: #e0b766; }
  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 14px;
    text-align: center;
    pointer-events: none;
  }
  .overlay[hidden] { display: none; }
  .overlay-title {
    font-size: clamp(18px, 3.4vw, 42px);
    font-weight: 700;
    color: #ffcf6b;
    text-shadow: 3px 3px 0 #5a1d12, 0 0 18px rgb(255 120 30 / 0.5);
  }
  .overlay-sub { font-size: clamp(12px, 1.6vw, 18px); color: #e6dfd0; text-shadow: 2px 2px 0 #000; }
}
</style>
</head>
<body>
<canvas class="screen" id="screen" width="960" height="540"></canvas>
<div class="overlay" id="overlay" hidden>
  <h1 class="overlay-title" id="overlay-title">Todos os slimes foram queimados</h1>
  <p class="overlay-sub" id="overlay-sub">Pressione Menu ou Enter para recomeçar</p>
</div>
<div class="hud" id="hud"></div>
<script>
'use strict';
(() => {
// ---------------------------------------------------------------- tuning
const W = 960, H = 540, STEP = 1 / 60;
const T = {
  gravity: 2300, fallMul: 1.25, maxFall: 1100, jumpV: 900, jumpCut: 0.45,
  coyote: 0.1, jumpBuffer: 0.12, takeoffMax: 2 / 60,
  accel: 2600, decel: 3000, airAccel: 1700, fireDecel: 6000,
  walkFps: 12, // walk anim fps in game; speed follows stride * fps / frames
  fireDps: 0.4, burnTime: 3.0,
  slimeSpeedMul: 2.0, panicMul: 4.5, slimeHalfW: 66, slimeBodyW: 130, slimeBodyH: 92,
  lightCooldown: 2.0, heavyCooldown: 4.5, hurtCooldown: 0.4, heavyJumpV: 620, heavyReach: 300, shockRange: 210,
  knockX: 540, knockY: 380,
  lookAhead: 120, camLerp: 6, shakeMax: 18, traumaDecay: 1.4,
  hitStop: 0.08, slowMoScale: 0.3, slowMoTime: 1.2,
  particleCap: 1400, decalCap: 360,
  lightDiv: 4, ambientAlpha: 0.62,
};

// ---------------------------------------------------------------- level
const LEVEL_W = 2880, WALL = 62, PLAT_H = 14, TOP_INSET = 5;
// Level layout; walkable tops are derived from the tile art at boot.
const LAYOUT = [
  { kind: 'stone', x: 430, top: 365 },
  { kind: 'catwalk', x: 880, top: 342, mids: 1 },
  { kind: 'stone', x: 1560, top: 360 },
  { kind: 'catwalk', x: 2140, top: 335, mids: 1 },
];
let FLOOR_Y = 487;
// Visual ground sink per character, in art px: moves only the sprite down, never the collision.
const CHAR_CFG = { 'slime-drop': { groundSink: 5 }, exterminator: { groundSink: 0 } };
// Extra visual offset per surface type, so every contact line sits inside the top face of its art.
const SURF_VIS = { ground: 0, stone: 0, catwalk: 0 };
const PLATFORMS = [];
const DRIP_SPOTS = [];

// ---------------------------------------------------------------- helpers
const rand = Math.random;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;

}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ctx2d(c, opts) { const g = c.getContext('2d', opts); g.imageSmoothingEnabled = false; return g; }

// A single-file build fills these maps: inlined manifest scripts and images as data URIs.
const EMBEDDED_SCRIPTS = window.EMBEDDED_SCRIPTS || {};
const EMBEDDED_ASSETS = window.EMBEDDED_ASSETS || {};

    const s = document.createElement('script');

}

}
function silhouette(img, color) {

}

// Hit rectangles per effect frame from the manifest `hitboxes`; the full frame box when the key is missing.
function effectRects(e) {

    const hb = e.hitboxes && e.hitboxes[f];
    out.push(hb ? hb.map((r) => [r.x, r.y, r.w, r.h]) : [[0, 0, e.frameWidth, e.frameHeight]]);

function buildSheet(m, img, effImgs) {
  const anims = {};
  for (const a of m.animations) anims[a.name] = a;
  const s = { id: m.id, img, fw: m.frameWidth, fh: m.frameHeight, pivot: m.pivot, anims, effects: {}, sink: (CHAR_CFG[m.id] || {}).groundSink || 0 };
  s.white = silhouette(img, '#ffffff');
  s.orange = silhouette(img, '#ff7a22');
  for (const [k, e] of Object.entries(m.effects || {})) {
    const ei = effImgs[k];
    const cols = Math.max(1, Math.floor(ei.width / e.frameWidth));
    const r = effectRects(e);
    s.effects[k] = { img: ei, fw: e.frameWidth, fh: e.frameHeight, frames: e.frames, anchor: e.anchor, cols, rects: r.rects, rectSource: r.source };
  }
  return s;
}

// Simple stand-in used only when the Exterminator manifest is missing.
function makePlaceholderExterminator() {
  const fw = 140, fh = 160, cols = 14, rows = 4;
  const sheet = mkCanvas(fw * cols, fh * rows), g = ctx2d(sheet);
  const C = { suit: '#8a7a34', suitD: '#5c5126', mask: '#2b2b2f', visor: '#6b8f78', tank: '#5a3d31', metal: '#4b4b53', boot: '#1d1b1a' };

    const r = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(ox + x, oy + y, w, h); };
    r(38, 66 + bob, 18, 46, C.tank);
    r(58 - spread, 108 + bob, 13, 51 - bob, C.suitD); r(54 - spread, 150, 20, 10, C.boot);
    r(52, 62 + bob, 36, 50, C.suit);
    r(56, 28 + bob, 30, 36, C.suit); r(78, 38 + bob, 12, 22, C.mask); r(80, 41 + bob, 10, 7, C.visor);
    r(70 + spread, 108 + bob, 13, 51 - bob, C.suit); r(68 + spread, 150, 20, 10, C.boot);
    r(66, 86 + gunY, 52, 10, C.metal); r(118, 89 + gunY, 18, 5, C.metal); r(74, 74 + bob, 10, 20, C.suitD);
  }
  for (let i = 0; i < 8; i++) guy(i * fw, 0, i % 4 < 2 ? 0 : 1, 3, 6);
  for (let i = 0; i < 8; i++) guy(i * fw, fh, Math.abs(Math.sin(i * Math.PI / 4)) * 2 | 0, Math.round(Math.sin(i * Math.PI / 4) * 12), 6);
  for (let i = 0; i < 10; i++) guy(i * fw, fh * 2, i < 2 || i > 7 ? 6 : -2, 6, 6);
  for (let i = 0; i < 14; i++) guy(i * fw, fh * 3, 0, 6, i < 3 ? 6 - i * 3 : i > 9 ? (i - 9) * 2 : 0);
  const ffw = 220, ffh = 90, nf = 5, fire = mkCanvas(ffw * nf, ffh), fg = ctx2d(fire), R = rng(7);
  const lens = [70, 200, 210, 120, 60], layers = [['#a8301a', 1], ['#e8661c', 0.72], ['#ffb43a', 0.48], ['#fff0b0', 0.25]];
  for (let k = 0; k < nf; k++) {
    fg.save(); fg.beginPath(); fg.rect(k * ffw, 0, ffw, ffh); fg.clip();
    for (const [col, sc] of layers) {
      fg.fillStyle = col;
      for (let t = 0; t <= lens[k]; t += 3) {
        const u = t / lens[k];

    fg.restore();
  }
  const id = fg.getImageData(0, 0, fire.width, fire.height);
  for (let i = 3; i < id.data.length; i += 4) id.data[i] = id.data[i] > 100 ? 255 : 0;
  fg.putImageData(id, 0, 0);
  const fx = [null, null];
  for (let i = 2; i < 14; i++) fx.push(i <= 10 ? { effect: 'fire', frame: i === 2 ? 0 : i >= 9 ? i - 6 : 1 + (i % 2), x: 136, y: 92 } : null);
  return {
    sheet, fire,
    manifest: {
      id: 'exterminator', image: sheet, frameWidth: fw, frameHeight: fh, pivot: { x: 70, y: 159 },
      animations: [
        { name: 'idle', row: 0, frames: 8, fps: 8, loop: true },
        { name: 'walk', row: 1, frames: 8, fps: 10, loop: true, stride: 96 },
        { name: 'jump', row: 2, frames: 10, fps: 12, loop: false, phases: { takeoff: [0, 1], air: [2, 6], land: [7, 9] } },
        { name: 'attack', row: 3, frames: 14, fps: 12, loop: false, fx, phases: { start: [0, 2], sustain: [3, 8], end: [9, 13] } },
      ],
      effects: { fire: { image: fire, frameWidth: ffw, frameHeight: ffh, frames: nf, anchor: { x: 4, y: 45 } } },
    },
  };
}

// ---------------------------------------------------------------- animation
function newAnim() { return { name: '', row: 0, from: 0, to: 0, loop: true, fps: 8, frame: 0, t: 0, done: false }; }
function play(a, sheet, name, range, loop, restart) {
  const d = sheet.anims[name];
  const from = range ? range[0] : 0, to = range ? range[1] : d.frames - 1;
  if (!restart && a.name === name && a.from === from && a.to === to) { a.loop = loop; return; }
  a.name = name; a.row = d.row; a.from = from; a.to = to; a.loop = loop; a.fps = d.fps;
  a.frame = from; a.t = 0; a.done = false;
}
function stepAnim(a, dt, mul) {
  if (a.done) return false;
  const before = a.frame;
  a.t += dt * a.fps * (mul || 1);
  while (a.t >= 1) {
    a.t -= 1;
    if (a.frame < a.to) a.frame++;
    else if (a.loop) a.frame = a.from;
    else { a.done = true; a.t = 0; break; }
  }
  return a.frame !== before;
}
function phases(sheet, name, key, fallback) {
  const d = sheet.anims[name];
  return (d.phases && d.phases[key]) || fallback(d.frames);
}

// ---------------------------------------------------------------- canvases
const screen = document.getElementById('screen');
let sctx = ctx2d(screen, { alpha: false });
const buf = mkCanvas(W, H), g = ctx2d(buf, { alpha: false });
const LD = T.lightDiv, LW = W / LD, LH = H / LD;
const lightCv = mkCanvas(LW, LH), lg = ctx2d(lightCv);
const glowCv = mkCanvas(LW, LH), gg = ctx2d(glowCv);
const decalCv = mkCanvas(LEVEL_W, H), dg = ctx2d(decalCv);
let levelCv = null;

function gradSprite(r, g2, b, a0) {
  const c = mkCanvas(64, 64), x = c.getContext('2d');
  const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, `rgba(${r},${g2},${b},${a0})`);
  gr.addColorStop(0.45, `rgba(${r},${g2},${b},${a0 * 0.45})`);
  gr.addColorStop(1, `rgba(${r},${g2},${b},0)`);
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return c;
}
const LIGHT_MASK = gradSprite(255, 255, 255, 1);
const GLOW = { fire: gradSprite(255, 110, 30, 0.22), lime: gradSprite(150, 220, 40, 0.18), cold: gradSprite(200, 190, 140, 0.15) };

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.max(1, Math.floor(Math.min((innerWidth * dpr) / W, (innerHeight * dpr) / H)));
  screen.width = W * s; screen.height = H * s;
  screen.style.width = (W * s) / dpr + 'px';
  screen.style.height = (H * s) / dpr + 'px';
  sctx = ctx2d(screen, { alpha: false });
  view.scale = s;
}
const view = { scale: 1 };

// ---------------------------------------------------------------- level art (baked from assets/level tiles)
let LA = null, tilesImg = null, farCv = null, midImg = null;
function piece(x, name, dx, dy, flip, sy0, sh) {
  const r = LA.tiles.pieces[name];
  const srcY = r[1] + (sy0 || 0), h = sh || r[3] - (sy0 || 0);
  if (!flip) x.drawImage(tilesImg, r[0], srcY, r[2], h, dx, dy, r[2], h);
  else { x.save(); x.translate(dx + r[2], 0); x.scale(-1, 1); x.drawImage(tilesImg, r[0], srcY, r[2], h, 0, dy, r[2], h); x.restore(); }
}
function layoutLevel() {
  const pc = LA.tiles.pieces, meta = LA.tiles.meta;
  FLOOR_Y = H - pc.ground[3] + meta.ground.surfaceY + TOP_INSET;
  PLATFORMS.length = 0;
  for (const l of LAYOUT) {
    const w = l.kind === 'stone' ? pc.stonePlatform[2] : pc.catwalkLeft[2] + pc.catwalkMidTile[2] * l.mids + pc.catwalkRight[2];
    const inset = l.kind === 'stone' ? 6 : 4;
    PLATFORMS.push({ kind: l.kind, mids: l.mids, artX: l.x, x: l.x + inset, w: w - inset * 2, y: l.top, artW: w });
  }
}
function surfVis(y) {
  if (y === FLOOR_Y) return SURF_VIS.ground;
  for (const p of PLATFORMS) if (y === p.y) return SURF_VIS[p.kind] || 0;
  return 0;
}
// Visual contact line of a slime: its collision y plus the sink and the surface offset.
function sb(s) { return s.y + SLIME.sink + surfVis(s.surf.y); }
function buildLevel() {
  const c = mkCanvas(LEVEL_W, H), x = ctx2d(c), pc = LA.tiles.pieces, meta = LA.tiles.meta;
  DRIP_SPOTS.length = 0;
  // props behind the play surfaces
  const groundTop = FLOOR_Y - TOP_INSET - meta.ground.surfaceY;
  const onFloor = (name, px, flip, sink) => piece(x, name, px, groundTop - pc[name][3] + (sink || 4), flip);
  onFloor('drainGrate', 300, false, 2); onFloor('drainGrate', 1720, true, 2); onFloor('drainGrate', 2480, false, 2);
  onFloor('barrel', 720, false); onFloor('barrel', 2040, true); onFloor('barrel', 2085, false);
  onFloor('crate', 640, false); onFloor('crate', 1880, true); onFloor('crate', 2700, false); onFloor('crate', 2690, true, -36);
  onFloor('bones', 1180, false); onFloor('bones', 2560, true); onFloor('bones', 160, true);
  // hooks hanging from chains up to the top of the screen
  for (const hx of [1350, 2420]) {
    const hy = 210;
    for (let y = hy - 16; y > -16; y -= 16) piece(x, 'chainHook', hx, y, false, 0, 16);
    piece(x, 'chainHook', hx, hy, false);
  }
  // pipes with valves coming out of the end walls
  piece(x, 'pipeValve', WALL - 20, 180, false);
  piece(x, 'pipeValve', LEVEL_W - WALL - pc.pipeValve[2] + 20, 220, true);
  // ground strip, mirrored every other tile to hide the seam
  const gt = pc.groundTile;
  for (let gx = 0, i = 0; gx < LEVEL_W; gx += gt[2], i++) piece(x, 'groundTile', gx, groundTop, i % 2 === 1);
  // platforms
  for (const p of PLATFORMS) {
    if (p.kind === 'stone') {
      const r = pc.stonePlatform, top = p.y - meta.stonePlatform.surfaceY - TOP_INSET, band = 40;
      for (let y = top - band; y > -band; y -= band) piece(x, 'stonePlatform', p.artX, y, false, 0, band);
      piece(x, 'stonePlatform', p.artX, top, false);
      DRIP_SPOTS.push({ x: p.artX + 30, y: top + r[3] - 2 }, { x: p.artX + 85, y: top + r[3] - 4 });
    } else {
      const top = p.y - TOP_INSET;
      piece(x, 'catwalkLeft', p.artX, top, false);
      let cx = p.artX + pc.catwalkLeft[2];
      for (let i = 0; i < p.mids; i++) { piece(x, 'catwalkMidTile', cx, top, i % 2 === 1); cx += pc.catwalkMidTile[2]; }
      piece(x, 'catwalkRight', cx, top, false);
      const bottom = top + pc.catwalkMid[3] - 3;
      const drips = ['drip1', 'drip2', 'drip3'];
      for (let i = 0, dx = p.artX + 70; dx < cx - 10; dx += 70, i++) {
        const dn = drips[i % 3];
        piece(x, dn, dx, bottom, false);

    const wx = side ? LEVEL_W - wr[2] : 0, flip = side === 1;

function buildFar(img) {

  x.save(); x.translate(img.width * 2, 0); x.scale(-1, 1); x.drawImage(img, 0, 0); x.restore();

}

// ---------------------------------------------------------------- particles (pooled, struct of arrays)
const PC = T.particleCap;
const P = {

  x: new Float32Array(PC), y: new Float32Array(PC), vx: new Float32Array(PC), vy: new Float32Array(PC),
  life: new Float32Array(PC), max: new Float32Array(PC), size: new Float32Array(PC), grav: new Float32Array(PC),
  drag: new Float32Array(PC), type: new Uint8Array(PC), seed: new Float32Array(PC),

const SMOKE = 0, EMBER = 1, FLAME = 2, GOO = 3, DUST = 4, DRIP = 5;
function spawn(type, x, y, vx, vy, life, size, grav, drag) {
  if (P.n >= PC) return;
  const i = P.n++;
  P.type[i] = type; P.x[i] = x; P.y[i] = y; P.vx[i] = vx; P.vy[i] = vy;
  P.life[i] = life; P.max[i] = life; P.size[i] = size; P.grav[i] = grav || 0; P.drag[i] = drag || 0; P.seed[i] = rand();

        const s = surfaceBelow(P.x[i], yPrev, P.y[i]);

          if (t === GOO) addDecal(P.x[i], s, P.size[i]);

  }
}
const COL = {
  smoke: ['#2a2629', '#3a3538', '#4a4448'],
  ember: ['#c8381a', '#ff7a1a', '#ffc23d', '#fff3b0'],
  flame: ['#5a1d12', '#c8381a', '#ff7a1a', '#ffc23d', '#fff3b0'],
  goo: ['#5f8a14', '#8cbf23', '#b6e23a'],
  dust: ['#3e3840', '#4f4851', '#5f5761'],
  drip: '#6f8a26',
};
function drawParticles(additive) {

// ---------------------------------------------------------------- input
const keys = new Set();
const input = { moveX: 0, jumpHeld: false, fire: false, jumpPressed: false, restartPressed: false };
const KEYMAP = { KeyA: 1, KeyD: 1, ArrowLeft: 1, ArrowRight: 1, KeyW: 1, ArrowUp: 1, Space: 1, KeyJ: 1, KeyX: 1, Enter: 1, KeyM: 1, F1: 1, ArrowDown: 1 };
addEventListener('keydown', (e) => {
  if (KEYMAP[e.code]) e.preventDefault();
  Sfx.init();
  if (e.repeat) return;
  keys.add(e.code);
  if (e.code === 'KeyW' || e.code === 'ArrowUp' || e.code === 'Space') input.jumpPressed = true;
  if (e.code === 'Enter') input.restartPressed = true;
  if (e.code === 'KeyM') { Sfx.setMuted(!Sfx.muted); updateHud(); }
  if (e.code === 'F1') game.debug = !game.debug;

addEventListener('keyup', (e) => { keys.delete(e.code); });
addEventListener('pointerdown', () => Sfx.init());
addEventListener('blur', () => keys.clear());
// Polling reads the pads every frame; the events only refresh the HUD at once.
addEventListener('gamepadconnected', () => { pad.id = '\u0000'; });
addEventListener('gamepaddisconnected', () => { pad.id = '\u0000'; });

const pad = { gp: null, id: '', standard: true, prev: [], rumbleT: 0 };
const padPressed = (b) => !!b && (b.pressed || b.value > 0.5);
function pollInput() {
  let mx = 0;
  if (keys.has('KeyA') || keys.has('ArrowLeft')) mx -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) mx += 1;
  let jumpHeld = keys.has('KeyW') || keys.has('ArrowUp') || keys.has('Space');
  let fire = keys.has('KeyJ') || keys.has('KeyX');
  let gp = null;
  const list = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of list) if (p && p.connected !== false) { gp = p; break; }
  pad.gp = gp;
  const id = gp ? gp.id : '';
  if (id !== pad.id) { pad.id = id; pad.standard = !gp || gp.mapping === 'standard'; pad.prev = []; updateHud(); }
  if (gp) {
    const b = gp.buttons, prev = pad.prev, now = Array.from(b, padPressed);
    now[7] = !!b[7] && (b[7].value > 0.3 || b[7].pressed);
    let ax = gp.axes[0] || 0;
    if (Math.abs(ax) < 0.25) ax = 0;
    if (now[14]) ax = -1;
    if (now[15]) ax = 1;
    if (ax !== 0) mx = Math.sign(ax);
    if (now[0]) jumpHeld = true;
    if (now[2] || now[7]) fire = true;
    if (now[0] && !prev[0]) input.jumpPressed = true;
    if (now[9] && !prev[9]) input.restartPressed = true;
    if (now.some((v, i) => v && !prev[i])) Sfx.init();
    pad.prev = now;

  const va = pad.gp && pad.gp.vibrationActuator;
  if (!va || typeof va.playEffect !== 'function') return;
  try {
    const p = va.playEffect('dual-rumble', { startDelay: 0, duration: ms, weakMagnitude: weak, strongMagnitude: strong });
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* unsupported actuator */ }
}

// ---------------------------------------------------------------- player
function playerBox() { return { x: player.x - 24, y: player.y - 150, w: 48, h: 148 }; }

function updatePlayer(dt) {
  const pl = player, a = pl.anim, wk = walkInfo();
  pl.coyote = pl.grounded ? T.coyote : pl.coyote - dt;
  pl.buffer = input.jumpPressed ? T.jumpBuffer : pl.buffer - dt;
  input.jumpPressed = false;
  const canAct = pl.hurtT <= 0;
  if (!canAct) pl.hurtT -= dt;

  if (!pl.attack && canAct && input.fire && pl.grounded) {
    pl.attack = 'start'; pl.landing = false;
    play(a, EXT, 'attack', phases(EXT, 'attack', 'start', (n) => [0, 2]), false, true);
    game.cam.kx += pl.facing * 6;
  }
  if (pl.attack) {
    pl.vx = Math.sign(pl.vx) * Math.max(0, Math.abs(pl.vx) - T.fireDecel * dt);
    if (pl.attack === 'start' && a.done) {
      if (input.fire) { pl.attack = 'sustain'; play(a, EXT, 'attack', phases(EXT, 'attack', 'sustain', (n) => [3, 8]), true, true); }
      else { pl.attack = 'end'; play(a, EXT, 'attack', phases(EXT, 'attack', 'end', (n) => [9, n - 1]), false, true); }
    } else if (pl.attack === 'sustain' && !input.fire) {
      pl.attack = 'end'; play(a, EXT, 'attack', phases(EXT, 'attack', 'end', (n) => [9, n - 1]), false, true);
    } else if (pl.attack === 'end' && a.done) {
      pl.attack = null;
    }
    stepAnim(a, dt);
  } else if (canAct) {
    const target = input.moveX * wk.speed;
    const acc = pl.grounded ? (input.moveX ? T.accel : T.decel) : T.airAccel;
    if (pl.vx < target) pl.vx = Math.min(target, pl.vx + acc * dt); else pl.vx = Math.max(target, pl.vx - acc * dt);
    if (input.moveX) pl.facing = input.moveX;
    if (pl.buffer > 0 && pl.coyote > 0) {
      pl.vy = -T.jumpV; pl.grounded = false; pl.coyote = 0; pl.buffer = 0; pl.cut = false; pl.airT = 0; pl.jumped = true; pl.landing = false;
      pl.sq = -0.14; dust(pl.x, pl.y, 10, 18, 70); Sfx.jump(); sporeGust(pl.x, pl.y - 30, 110, 70);
    }
    if (!input.jumpHeld && pl.vy < 0 && !pl.cut) { pl.vy *= T.jumpCut; pl.cut = true; }

    pl.vx *= Math.exp(-dt * 2.5);

  pl.vy = Math.min(T.maxFall, pl.vy + T.gravity * (pl.vy > 0 ? T.fallMul : 1) * dt);
  const prevY = pl.y, impact = pl.vy;
  pl.x += pl.vx * dt; pl.y += pl.vy * dt;
  if (pl.x < WALL + 24) { pl.x = WALL + 24; pl.vx = 0; }
  if (pl.x > LEVEL_W - WALL - 24) { pl.x = LEVEL_W - WALL - 24; pl.vx = 0; }

  if (pl.vy >= 0) {
    if (pl.y >= FLOOR_Y) { pl.y = FLOOR_Y; landed = true; }
    else for (const p of PLATFORMS) if (pl.x >= p.x - 6 && pl.x <= p.x + p.w + 6 && prevY <= p.y + 0.5 && pl.y >= p.y) { pl.y = p.y; landed = true; break; }
  }
  if (landed) {
    pl.vy = 0;
    if (!pl.grounded) {

      pl.sq = 0.06 + 0.16 * k; pl.landing = !pl.attack;
      dust(pl.x, pl.y, 8 + ((k * 12) | 0), 22, 40 + 80 * k); Sfx.land(k);
      addTrauma(0.08 + 0.2 * k);

    }
  }
  if (!landed && pl.grounded) pl.jumped = false;

      } else {
        const u = clamp((pl.vy + T.jumpV * 0.9) / (T.jumpV * 1.8), 0, 1);

      stepAnim(a, dt);

      }

      stepAnim(a, dt);

}

function computeFire() {
  fireActive = false; fireRects.length = 0;
  const pl = player;
  if (!pl.attack || pl.anim.name !== 'attack') return;
  const fxl = EXT.anims.attack.fx, fx = fxl && fxl[pl.anim.frame];
  if (!fx) return;
  const e = EXT.effects[fx.effect];
  if (!e) return;
  fireActive = true;
  const px = pl.x - pl.facing * pl.recoil, f = pl.facing;
  const ox = -EXT.pivot.x + fx.x - e.anchor.x, oy = pl.y - EXT.pivot.y + fx.y - e.anchor.y;
  nozzle.x = px + f * (-EXT.pivot.x + fx.x); nozzle.y = pl.y - EXT.pivot.y + fx.y;
  for (const r of e.rects[fx.frame] || []) {
    const u = ox + r[0];
    fireRects.push({ x: f > 0 ? px + u : px - u - r[2], y: oy + r[1], w: r[2], h: r[3] });

    computeFire();
    const f = player.facing;
    for (let i = 0; i < 3; i++) spawn(EMBER, nozzle.x + f * rr(0, 10), nozzle.y + rr(-4, 4), f * rr(220, 520), rr(-160, 40), rr(0.25, 0.7), rr(1, 2.5), 250, 2);
    const tip = fireRects[fireRects.length - 1];
    if (tip && rand() < 0.5) spawn(SMOKE, tip.x + tip.w / 2, tip.y + rr(0, tip.h / 2), f * rr(20, 60), rr(-60, -20), rr(0.6, 1.2), rr(4, 8), -30, 1);
    if (tip && rand() < 0.6) spawn(FLAME, tip.x + rr(0, tip.w), tip.y + rr(0, tip.h), f * rr(30, 90), rr(-90, -30), rr(0.15, 0.35), rr(3, 6), -100, 2);
    game.cam.kx += (f * 5 - game.cam.kx) * 0.3 + rr(-0.6, 0.6);
    game.trauma = Math.max(game.trauma, 0.12);
    fireRumbleT -= dt;
    if (fireRumbleT <= 0) { rumble(90, 0.3, 0.06); fireRumbleT = 0.12; }
  }
  for (const s of slimes) updateSlime(s, dt);
  dripT -= dt;
  if (dripT <= 0 && DRIP_SPOTS.length) { const d = DRIP_SPOTS[(rand() * DRIP_SPOTS.length) | 0]; spawn(DRIP, d.x + rr(-2, 2), d.y, 0, 20, 3, 2, 900, 0); dripT = rr(0.15, 0.6); }
  updateParticles(dt);

  const cam = game.cam;
  cam.look += (player.facing * T.lookAhead - cam.look) * (1 - Math.exp(-dt * 2.5));
  const target = clamp(player.x + cam.look - W / 2, 0, LEVEL_W - W);
  cam.x += (target - cam.x) * (1 - Math.exp(-dt * T.camLerp));
  cam.kx *= Math.exp(-dt * 10);
  game.trauma = Math.max(0, game.trauma - T.traumaDecay * dt);
  const sh = game.trauma * game.trauma * T.shakeMax;
  game.shake.x = (rand() * 2 - 1) * sh + cam.kx;
  game.shake.y = (rand() * 2 - 1) * sh * 0.7;
  updateSpores(dt, cam.x, game.time);

  if (game.endT > 0) { game.endT -= dt; if (game.endT <= 0) { game.won = true; overlay.hidden = false; } }
}

// ---------------------------------------------------------------- render
function drawSprite(sheet, img, row, frame, x, y, flip, scx, scy) {
  const { fw, fh, pivot } = sheet;
  const w = Math.round(fw * scx), h = Math.round(fh * scy);
  const dy = Math.round(y + sheet.sink - pivot.y * scy);
  if (!flip) g.drawImage(img, frame * fw, row * fh, fw, fh, Math.round(x - pivot.x * scx), dy, w, h);
  else {
    g.save(); g.translate(Math.round(x), 0); g.scale(-1, 1);
    g.drawImage(img, frame * fw, row * fh, fw, fh, Math.round(-pivot.x * scx), dy, w, h);
    g.restore();
  }
}

function drawSlime(s) {
  const a = s.anim;
  let x = s.x, y = s.y + surfVis(s.surf.y), scx = 1 + s.sq, scy = 1 - s.sq;
  const burning = s.burnT > 0 && s.state !== 'dead';
  if (s.tremble) { x += ((rand() * (2 * s.tremble + 1)) | 0) - s.tremble; y -= (rand() * 2) | 0; }
  if (burning && s.state !== 'dying') {
    const wob = Math.sin(game.time * 38 + s.id) * 0.06;
    scx += wob; scy -= wob;
    x += ((rand() * 5) | 0) - 2;
  }
  const flip = s.facing < 0;
  drawSprite(SLIME, SLIME.img, a.row, a.frame, x, y, flip, scx, scy);
  if (s.state === 'dead') return;
  let ov = null, alpha = 0;
  if (s.flash > 0) { ov = SLIME.white; alpha = 0.8; }
  else if (s.tremble && ((game.time * 12) | 0) % 2 === 0) { ov = SLIME.white; alpha = 0.35; }
  else if (burning) {
    const ph = ((game.time * 16) | 0) % 3;
    if (ph === 0) { ov = SLIME.white; alpha = s.touchT > 0 ? 0.45 : 0.3; }
    else if (ph === 1) { ov = SLIME.orange; alpha = s.touchT > 0 ? 0.5 : 0.35; }
  }
  if (ov) { g.globalAlpha = alpha; drawSprite(SLIME, ov, a.row, a.frame, x, y, flip, scx, scy); g.globalAlpha = 1; }
}

function drawPlayer() {
  const pl = player, a = pl.anim, flip = pl.facing < 0;
  const x = pl.x - pl.facing * pl.recoil, scx = 1 + pl.sq * 0.7, scy = 1 - pl.sq;
  const y = pl.y + (pl.grounded ? surfVis(pl.y) : 0);
  drawSprite(EXT, EXT.img, a.row, a.frame, x, y, flip, scx, scy);
  if (pl.flash > 0) { g.globalAlpha = 0.85; drawSprite(EXT, EXT.white, a.row, a.frame, x, y, flip, scx, scy); g.globalAlpha = 1; }
}

function drawFireEffect() {
  if (!fireActive) return;
  const pl = player, fx = EXT.anims.attack.fx[pl.anim.frame], e = EXT.effects[fx.effect];
  const x = Math.round(pl.x - pl.facing * pl.recoil);
  const sx = (fx.frame % e.cols) * e.fw, sy = ((fx.frame / e.cols) | 0) * e.fh;
  const lx = -EXT.pivot.x + fx.x - e.anchor.x, ly = Math.round(pl.y - EXT.pivot.y + fx.y - e.anchor.y);
  if (pl.facing > 0) g.drawImage(e.img, sx, sy, e.fw, e.fh, x + lx, ly, e.fw, e.fh);
  else { g.save(); g.translate(x, 0); g.scale(-1, 1); g.drawImage(e.img, sx, sy, e.fw, e.fh, lx, ly, e.fw, e.fh); g.restore(); }
}

const lights = [];
function addLight(x, y, r, i, glow) { lights.push(x, y, r, i, glow); }
function renderLighting(camX, camY) {
  lights.length = 0;
  const flick = 0.85 + rand() * 0.15;
  addLight(player.x, player.y - 90, 220, 0.5, null);
  addSporeLights(camX, game.time);
  if (fireActive) {
    addLight(nozzle.x, nozzle.y, 220, 1 * flick, 'fire');
    const mid = fireRects[Math.min(2, fireRects.length - 1)];
    if (mid) addLight(mid.x + mid.w / 2, mid.y + mid.h / 2, 300, 0.95 * flick, 'fire');
  }
  for (const s of slimes) {
    if (s.state === 'dead') addLight(s.x, sb(s) - 10, 90 + rand() * 10, 0.45 * flick, 'fire');
    else if (s.burnT > 0) addLight(s.x, sb(s) - 50, 220, 0.8 * flick, 'fire');
    else if (s.state !== 'dying') addLight(s.x, sb(s) - 40, 140, 0.35, 'lime');
  }
  lg.globalCompositeOperation = 'source-over';
  lg.clearRect(0, 0, LW, LH);
  lg.fillStyle = `rgba(4,3,10,${T.ambientAlpha})`;
  lg.fillRect(0, 0, LW, LH);
  lg.globalCompositeOperation = 'destination-out';
  gg.clearRect(0, 0, LW, LH);
  gg.globalCompositeOperation = 'lighter';
  for (let i = 0; i < lights.length; i += 5) {
    const r = lights[i + 2] / LD, d = Math.round(r * 2);
    const lx = Math.round((lights[i] - camX) / LD - r), ly = Math.round((lights[i + 1] - camY) / LD - r);
    if (lx > LW || ly > LH || lx + d < 0 || ly + d < 0) continue;
    lg.globalAlpha = lights[i + 3];
    lg.drawImage(LIGHT_MASK, lx, ly, d, d);
    const gl = lights[i + 4];
    if (gl) { gg.globalAlpha = lights[i + 3]; gg.drawImage(GLOW[gl], lx, ly, d, d); }
  }
  lg.globalAlpha = 1; gg.globalAlpha = 1;
  g.drawImage(lightCv, 0, 0, W, H);
}

function render() {
  const camX = clamp(Math.round(game.cam.x + game.shake.x), 0, LEVEL_W - W);
  const camY = Math.round(game.shake.y);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const fw2 = farCv.width, fo = Math.floor(camX * LA.far.parallax) % fw2, fy = H - farCv.height - camY;
  g.drawImage(farCv, -fo, fy); if (fw2 - fo < W) g.drawImage(farCv, fw2 - fo, fy);
  drawSpores(0, 0, camY);
  const mw = midImg.width, mo = Math.floor(camX * LA.mid.parallax) % mw, my = FLOOR_Y - TOP_INSET + 4 - midImg.height - camY;
  for (let mx = -mo; mx < W; mx += mw) g.drawImage(midImg, mx, my);
  drawSpores(1, 0, camY);
  g.drawImage(levelCv, camX, 0, W, H, 0, -camY, W, H);
  flushDecals();
  g.drawImage(decalCv, camX, 0, W, H, 0, -camY, W, H);
  drawSpores(2, 0, camY);
  g.save(); g.translate(-camX, -camY);
  for (const s of slimes) if (s.state === 'dead') drawSlime(s);
  for (const s of slimes) if (s.state !== 'dead') drawSlime(s);
  drawPlayer();
  drawParticles(false);
  g.restore();
  renderLighting(camX, camY);
  drawSpores(2, 1, camY);
  drawSporesPost(camX, camY);
  g.save(); g.translate(-camX, -camY);
  drawFireEffect();
  g.globalCompositeOperation = 'lighter';
  drawParticles(true);
  g.restore();
  g.drawImage(glowCv, 0, 0, W, H);
  drawSporeGlow(camY, game.time);
  g.globalCompositeOperation = 'source-over';
  if (game.debug) drawDebug(camX, camY);
  sctx.drawImage(buf, 0, 0, screen.width, screen.height);
}

function strokeBox(b, col) { g.strokeStyle = col; g.strokeRect(Math.round(b.x) + 0.5, Math.round(b.y) + 0.5, Math.round(b.w) - 1, Math.round(b.h) - 1); }
function drawDebug(camX, camY) {
  g.save(); g.translate(-camX, -camY); g.lineWidth = 1;
  strokeBox(playerBox(), '#3cf');
  g.fillStyle = '#3cf'; g.fillRect(Math.round(player.x) - 1, Math.round(player.y) - 1, 3, 3);
  for (const r of fireRects) strokeBox(r, '#f33');
  if (fireActive) { g.fillStyle = '#ff0'; g.fillRect(Math.round(nozzle.x) - 1, Math.round(nozzle.y) - 1, 3, 3); }
  g.font = '10px monospace';
  for (const s of slimes) {
    strokeBox(slimeBox(s), s.burnT > 0 ? '#f80' : '#9f3');
    g.fillStyle = '#fff';
    g.fillText(`${s.state} hp:${Math.max(0, s.hp).toFixed(2)} burn:${Math.max(0, s.burnT).toFixed(1)}`, Math.round(s.x - 60), Math.round(s.y - 104));
  }
  for (const p of PLATFORMS) strokeBox({ x: p.x, y: p.y, w: p.w, h: PLAT_H }, '#888');
  g.restore();
  const st = game.stats;
  g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(4, 4, 330, 56);
  g.fillStyle = '#9f9'; g.font = '10px monospace';
  g.fillText(`FPS ${st.fps.toFixed(0)}  frame ${st.frameMs.toFixed(1)} ms  work ${st.workMs.toFixed(2)} ms`, 10, 18);
  g.fillText(`particles ${P.n}/${PC}  decals ${D.n}/${DC}  trauma ${game.trauma.toFixed(2)}`, 10, 30);
  g.fillText(`spores ${SP.n} (density ${SPORE_DENSITY})`, 10, 54);
  g.fillText(`player ${player.anim.name}:${player.anim.frame} ${player.attack || ''}  fire rects ${EXT.effects.fire ? EXT.effects.fire.rectSource : '-'}`, 10, 42);
}

// ---------------------------------------------------------------- loop
let last = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (game.paused || !game.ready) { last = now; return; }
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  const st = game.stats;
  st.frameMs += (dt * 1000 - st.frameMs) * 0.05;
  st.fps = st.frameMs > 0 ? 1000 / st.frameMs : 0;
  const t0 = performance.now();
  pollInput();
  if (input.restartPressed) { input.restartPressed = false; resetRound(); }
  if (game.hitStop > 0) {
    game.hitStop -= dt;
    if (game.hitStop <= 0) { addTrauma(game.pendingTrauma); game.pendingTrauma = 0; }
  } else {
    let scale = 1;
    if (game.slowT > 0) { game.slowT -= dt; scale = T.slowMoScale; }
    acc += dt * scale;
    let n = 0;
    while (acc >= STEP && n < 6) { update(STEP); acc -= STEP; n++; }
    if (n === 6) acc = 0;
    st.steps += n;
  }
  let burning = 0;
  for (const s of slimes) if (s.burnT > 0 && s.state !== 'dead') burning++;
  Sfx.update(fireActive && game.hitStop <= 0, burning);
  render();
  st.workMs += (performance.now() - t0 - st.workMs) * 0.05;
}

document.addEventListener('visibilitychange', () => {
  game.paused = document.hidden;
  if (Sfx.ctx) { if (document.hidden) Sfx.ctx.suspend(); else Sfx.ctx.resume(); }
  acc = 0; keys.clear();
});
addEventListener('resize', resize);

async function boot() {
  resize();
  updateHud();
  await loadScript('assets/slime/slime-drop-anim.manifest.js');
  await loadScript('assets/exterminator/exterminator-anim.manifest.js');
  const A = window.SPRITE_ANIMS || {};
  const sm = A['slime-drop'];
  if (!sm) {
    overlay.hidden = false;
    document.getElementById('overlay-title').textContent = 'Manifesto do slime não encontrado';
    document.getElementById('overlay-sub').textContent = 'Esperado: assets/slime/slime-drop-anim.manifest.js no formato SPRITE_ANIMS';
    return;
  }
  SLIME = buildSheet(sm, await loadImage('assets/slime/' + sm.image), {});
  const em = A.exterminator;
  if (em) {
    const dir = 'assets/exterminator/';
    const eff = {};
    for (const [k, e] of Object.entries(em.effects || {})) eff[k] = await loadImage(dir + e.image);
    EXT = buildSheet(em, await loadImage(dir + em.image), eff);
    EXT.real = true;
  } else {
    const ph = makePlaceholderExterminator();
    EXT = buildSheet(ph.manifest, ph.sheet, { fire: ph.fire });
    EXT.real = false;
  }
  await loadScript('assets/level/level-assets.manifest.js');
  LA = window.LEVEL_ASSETS;
  if (!LA) throw new Error('level assets manifest missing');
  [tilesImg, midImg] = await Promise.all([loadImage('assets/level/' + LA.tiles.image), loadImage('assets/level/' + LA.mid.image)]);
  farCv = buildFar(await loadImage('assets/level/' + LA.far.image));
  layoutLevel();
  levelCv = buildLevel();
  slimePhases();
  resetRound();
  game.ready = true;
}

window.__game = { game, player, slimes, input, keys, T, P, D, SP, sfx: Sfx, get ext() { return EXT; }, get fireRects() { return fireRects; }, get fireActive() { return fireActive; }, resetRound: () => resetRound() };
requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
boot();
})();
</script>
</body>
